<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Order Form</title>
</head>

<body>

    <h1>Menu Order Form</h1>

    <form method="get">

        <!-- Customer Name -->
        <label for="customer">Your name:</label>
        <input type="text" id="customer" name="customer" required>

        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <!-- Food Choice -->
        <fieldset>
            <legend>Choose your dish</legend>

            <input type="radio" id="vegthai" name="dish" value="Veg Thai - ₹30">
            <label for="vegthai">Veg Thai - ₹30</label>

            <br>

            <input type="radio" id="curdrice" name="dish" value="Curd Rice - ₹60">
            <label for="curdrice">Curd Rice - ₹60</label>

            <br>

            <input type="radio" id="chapati" name="dish" value="Chapati - ₹35">
            <label for="chapati">Chapati - ₹35</label>
        </fieldset>

        <br>

        <!-- Quantity -->
        <label for="quantity">How many plates?</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10">

        <br><br>

        <!-- Notes -->
        <label for="notes">Anything else?</label>
        <br>
        <textarea id="notes" name="notes" rows="4" cols="40"></textarea>

        <br><br>

        <!-- Submit -->
        <input type="submit" value="Send">

    </form>

</body>
</html>
