<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Order Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.8s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 35px;
            font-size: 2.5em;
            animation: fadeInDown 0.8s ease-out 0.2s backwards;
            text-shadow: 2px 2px 4px rgba(102, 126, 234, 0.1);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            animation: fadeIn 0.8s ease-out 0.3s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 25px;
            animation: slideInLeft 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.4s; }
        .form-group:nth-child(2) { animation-delay: 0.5s; }
        .form-group:nth-child(3) { animation-delay: 0.6s; }
        .form-group:nth-child(4) { animation-delay: 0.7s; }
        .form-group:nth-child(5) { animation-delay: 0.8s; }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
            transition: color 0.3s ease;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        input[type="text"]:hover,
        input[type="tel"]:hover,
        input[type="number"]:hover,
        textarea:hover {
            border-color: #764ba2;
        }

        fieldset {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            transition: all 0.3s ease;
        }

        fieldset:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        legend {
            padding: 0 10px;
            color: #667eea;
            font-weight: 700;
            font-size: 1.1em;
        }

        .radio-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .radio-group:hover {
            background: rgba(102, 126, 234, 0.08);
            transform: translateX(5px);
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-right: 12px;
            accent-color: #667eea;
            transition: transform 0.3s ease;
        }

        input[type="radio"]:hover {
            transform: scale(1.2);
        }

        input[type="radio"]:checked + label {
            color: #667eea;
            font-weight: 700;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: slideInUp 0.6s ease-out 0.9s backwards;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        input[type="submit"]:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍽️ Menu Order Form</h1>

    <form method="get">
        <!-- Customer Name -->
        <div class="form-group">
            <label for="customer">Your name:</label>
            <input type="text" id="customer" name="customer" placeholder="Enter your name">
        </div>

        <!-- Phone Number -->
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        </div>

        <!-- Dish Selection -->
        <div class="form-group">
            <fieldset>
                <legend>Choose your dish</legend>

                <div class="radio-group">
                    <input type="radio" id="vegthai" name="dish" value="Veg Thai - ₹30">
                    <label for="vegthai">Veg Thai - ₹30</label>
                </div>

                <div class="radio-group">
                    <input type="radio" id="curdrice" name="dish" value="Curd Rice - ₹60">
                    <label for="curdrice">Curd Rice - ₹60</label>
                </div>

                <div class="radio-group">
                    <input type="radio" id="chapati" name="dish" value="Chapati - ₹35">
                    <label for="chapati">Chapati - ₹35</label>
                </div>
            </fieldset>
        </div>

        <!-- Quantity -->
        <div class="form-group">
            <label for="quantity">How many plates?</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10" placeholder="Enter quantity">
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label for="notes">Anything else?</label>
            <textarea id="notes" name="notes" placeholder="Add any special requests..."></textarea>
        </div>

        <!-- Submit Button -->
        <input type="submit" value="Send Order">
    </form>
</div>

</body>
</html>
